name: Build

on:
  push:

jobs:
  Validate-infra:
    runs-on: ubuntu-latest
    permissions:
      contents: read # required for actions/checkout
    steps:
      - name: Validate infrastructure
        uses: agilecustoms/gha-validate-terraform@main
        with:
          git-token: ${{ secrets.GIT_TF_TOKEN }}

  Build:
    runs-on: ubuntu-latest # slim has no 'zip' command
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      # Once I have reusable npm package - add 'Prepare for Build' step like in Java build to generate npm token
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Generate OpenAPI spec
        run: npm run openapi

      - name: Package
        run: |
          npm prune --production
          make app3-package

      - name: Upload artifacts
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          path: |
            dist/app.zip
            dist/openapi.json

  Release:
    if: github.ref == 'refs/heads/main'
    needs:
      - Validate-infra
      - Build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: s3

      - name: Release
        uses: agilecustoms/gha-release@main
        with:
          gitops-token: ${{ secrets.GH_TOKEN }}
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
