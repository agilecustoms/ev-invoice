name: Build

on:
  push:

jobs:
  Validate-infra:
    runs-on: ubuntu-slim
    permissions:
      contents: read # required for actions/checkout
    steps:
      - name: Validate infrastructure
        uses: agilecustoms/gha-validate-terraform@main
        with:
          git-token: ${{ secrets.GIT_TF_TOKEN }}

  Build:
    runs-on: ubuntu-latest # slim has no 'zip' command
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # TODO: replace with gha-setup-node once I have private npm packages
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          cache: 'npm'
          node-version: 26

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: make app1-lint

      - name: Test
        run: make app2-test

      - name: Build
        run: make app3-build

      - name: Generate OpenAPI spec
        run: make app3-generate-openapi

      - name: Package
        run: make app3-package

      - name: Upload artifacts
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          path: |
            dist/app.zip
            dist/openapi.json

  Release:
    if: github.ref == 'refs/heads/main'
    needs:
      - Validate-infra
      - Build
    runs-on: ubuntu-slim
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: s3

      - name: Release
        uses: agilecustoms/gha-release@main
        with:
          gitops-token: ${{ secrets.GH_TOKEN }}
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
